    ["Security & Access","Login IP Ranges","Set on the profile. Logins from outside the range are blocked outright."],
    ["Security & Access","Trusted IP Ranges","Set org-wide under Network Access. Logins inside the range skip identity verification; logins outside still work but trigger a verification code. Never blocks."],
    ["Security & Access","Login Hours","Profile setting restricting the days and times a user can log in."],
    ["Security & Access","Setup Audit Trail","Six months of configuration changes with who made each one and when. The first stop when something in the org changed unexpectedly."],
    ["Security & Access","Login History","Six months of login records including date, time, user, and IP address."],
    ["Security & Access","Session Settings","Org-level security controls including session timeout and how long a new user's verification link stays valid — 1 day, 7 days, or 180 days."],
    ["Security & Access","Password Policies","Where password expiry, complexity, history, and the lockout effective period are set. Lockout options are 15, 30, or 60 minutes, or Forever until an admin resets."],
    ["Security & Access","OAuth 2.0","An authorization framework that lets one service act on a user's behalf without handling their password."],

    ["Data Model","Standard Object","A Salesforce-provided object such as Account, Contact, Lead, Opportunity, or Case. You can add custom fields but cannot create new standard objects."],

    ["Data Model","Lookup Relationship","A loose link between two records. The child can exist without a parent, and deleting the parent leaves the child behind."],
    ["Data Model","Master-Detail Relationship","A tight link where the detail record has no owner of its own, inherits sharing from the master, and is deleted when the master is. The relationship field always lives on the detail object."],
    ["Data Model","Junction Object","A custom object with two master-detail relationships, used to build a many-to-many relationship."],

  let mode = "misses", filter = "all", quizMode = false;
  let done = {}, star = {}, notes = {}, bad = {};
  const askBad = {};
  const revealed = {}, flipped = {};
  let revealAll = false, order = null, scrollTo_ = null, barsOpen = true;
  const root = document.getElementById("root");

  const KEY = "sfadmin-state-v1";
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const st = JSON.parse(raw);
      done = st.done || {}; star = st.star || {}; notes = st.notes || {};
      bad = st.bad || {}; if(st.barsOpen === false) barsOpen = false;
    }
  }catch(e){}

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(
      {done:done, star:star, notes:notes, bad:bad, barsOpen:barsOpen})); }catch(e){}
  }

  function addNote(k,text){
    text = (text||"").trim();
    if(!text) return;
    (notes[k] = notes[k] || []).push({t:text});
    save();
  }
  function deck(m){ return m==="cards2" ? F2 : F; }
  function deckKey(m){ return m==="cards2" ? "g" : "f"; }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
  function dname(id){const d=DOMAINS.find(x=>x[0]===id);return d?d[1]:id}
  function refLabel(k){
    const c = String(k).charAt(0);
    if(c==="f") return "Card "+String(k).slice(1);
    if(c==="g") return "FC2 "+String(k).slice(1);
    if(c==="q") return "QPT1 Q"+String(k).slice(1);
    return "SFBEN Q"+k;
  }

  /* ---------- header ---------- */
  function header(){
    let h = '<div class="head"><div class="headtop"><div class="attempts">'
      + '<div class="att"><b>55%</b><span>Practice 1 &middot; SF Ben &middot; 33 of 60</span></div>'
      + '<div class="att two"><b>75%</b><span>Practice 2 &middot; Bridge GPT &middot; 49 of 65 &middot; <em>passed</em></span></div>'
      + '<div class="att two"><b>90%</b><span>Practice 3 &middot; Quizlet &middot; 18 of 20 &middot; <em>passed</em></span></div>'
      + '<div class="att two"><b>77%</b><span>Practice 4 &middot; Bridge GPT &middot; 46 of 60 &middot; <em>passed</em></span></div>'
      + '</div>'
      + '<button class="collapse" id="toggleBars" aria-expanded="'+barsOpen+'">'
      + '<span class="chev">&#9660;</span>'+(barsOpen?"Hide":"Section scores")+'</button>'
      + '</div>';

    if(!barsOpen){
      const weak = DOMAINS.filter(d=>d[4]<80).sort((a,b)=>b[5]-a[5])
        .map(d=>d[1].replace(" & Lightning App Builder","").replace(" Applications","").replace(" Management","")+' <b>'+d[4]+'%</b>');
      return h + '<p class="minisum">Below 80% on the latest test, heaviest first: '+weak.join(' &middot; ')+'</p></div>';
    }

    h += '<div class="bars">';
    DOMAINS.forEach(([id,name,t1,t2,t3,w])=>{
      h += '<div class="bar"><div class="name">'+name+' <em>&middot; '+w+'% of the exam</em>'
        + '<div class="track"><div class="fill" style="width:'+(t1||0)+'%"></div><div class="pass"></div></div>'
        + '<div class="track"><div class="fill" style="width:'+t2+'%"></div><div class="pass"></div></div>'
        + '<div class="track t2"><div class="fill'+(t3<65?' low':'')+'" style="width:'+t3+'%"></div><div class="pass"></div></div>'
        + '</div><div class="pct">'+(t1===null?'&mdash;':t1)+' &middot; '+t2+' <b>&middot; '+t3+'%</b></div></div>';
    });
    h += '</div><p class="legend">Sections ordered by weight on the current Platform Administrator outline. '
      + 'Bars run oldest to newest, vertical line is the 65% pass mark. '
      + 'Weighted against these section weights, practice 4 comes out around 77%.</p></div>';
    return h;
  }

  /* ---------- controls ---------- */
  function controls(){
    const dn = Object.keys(done).filter(k=>done[k]).length;
    const sn = Object.keys(star).filter(k=>star[k]).length;
    const nn = Object.keys(notes).filter(k=>(notes[k]||[]).length).length;
    const total = mode==="misses" ? Q.filter(q=>!bad[q.n]).length
                : mode==="qpt1" ? QP.filter(q=>!bad["q"+q.n]).length
                : deck(mode).filter(f=>!bad[deckKey(mode)+f.i]).length;

    let opts = '<optgroup label="Lists">'
      + opt("all", (mode==="misses"?"All missed questions":mode==="qpt1"?"All 20 questions":"All flashcards")+" ("+total+")")
      + opt("star","★ Quick study ("+sn+")")
      + opt("notes","✎ My highlights ("+nn+")")
      + '</optgroup><optgroup label="Exam section">';
    DOMAINS.forEach(([id,name])=>{
      const c = (mode==="misses" ? Q.filter(q=>q.d===id && !bad[q.n]).length
                : mode==="qpt1" ? QP.filter(q=>q.d===id && !bad["q"+q.n]).length
                : deck(mode).filter(f=>f.d===id && !bad[deckKey(mode)+f.i]).length);
      if(c) opts += opt(id, name.replace(" & Lightning App Builder","")+" ("+c+")");
    });
    opts += '</optgroup>';
    if(mode==="misses"){
      opts += '<optgroup label="Why I missed it">';
      Object.keys(TAGS).forEach(t=>{
        opts += opt(t, TAGS[t]+" ("+Q.filter(q=>q.t.includes(t) && !bad[q.n]).length+")");
      });
      opts += '</optgroup>';
    }

    let h = '<div class="controls"><div class="crow">'
      + '<div class="seg">'
      + '<button data-mode="misses" aria-pressed="'+(mode==="misses")+'">SFBENPT</button>'
      + '<button data-mode="qpt1" aria-pressed="'+(mode==="qpt1")+'">QPT1</button>'
      + '<button data-mode="cards" aria-pressed="'+(mode==="cards")+'">Flashcards</button>'
      + '<button data-mode="cards2" aria-pressed="'+(mode==="cards2")+'">Flashcards2</button>'
      + '<button data-mode="gaps" aria-pressed="'+(mode==="gaps")+'">Not yet tested</button>'
      + '<button data-mode="bad" aria-pressed="'+(mode==="bad")+'">Questionable ('+Object.keys(bad).length+')</button>'
      + '<button data-mode="defs" aria-pressed="'+(mode==="defs")+'">Definitions</button>'
      + '<button data-mode="exam" aria-pressed="'+(mode==="exam")+'">Exam day</button>'
      + '</div>';
    if(mode!=="gaps" && mode!=="bad" && mode!=="exam" && mode!=="defs") h += '<select class="filter" id="filterSel">'+opts+'</select>';
    if(mode==="gaps" || mode==="bad" || mode==="exam" || mode==="defs"){
      h += '';
    }else if(mode==="misses" || mode==="qpt1"){
      h += '<button class="tool" id="quiz" aria-pressed="'+quizMode+'">'+(quizMode?"Answers hidden":"Quiz me")+'</button>';
    }else{
      h += '<button class="tool" id="revealAll" aria-pressed="'+revealAll+'">'+(revealAll?"Hide answers":"Show all")+'</button>'
        + '<button class="tool" id="shuffle">Shuffle</button>';
    }
    h += '</div><div class="count">'+dn+' of '+(Q.length+QP.length+F.length+F2.length)+' marked as learned &middot; '+sn+' in quick study</div></div>';
    return h;
  }
  function opt(v,label){ return '<option value="'+v+'"'+(filter===v?" selected":"")+'>'+label+'</option>'; }

  /* ---------- highlights list ---------- */
  function notesView(){
    const keys = Object.keys(notes).filter(k=>(notes[k]||[]).length);
    if(!keys.length) return '<p class="empty">No highlights yet. Select any text on a card and save it here.</p>';
    keys.sort((a,b)=>{
      const fa=String(a).charAt(0)==="f", fb=String(b).charAt(0)==="f";
      if(fa!==fb) return fa?1:-1;
      return parseInt(String(a).replace("f",""),10) - parseInt(String(b).replace("f",""),10);
    });
    let h = '<div class="sheet"><h2>My highlights</h2>'
      + '<p class="sub">Everything you highlighted, across both practice tests. Click a label to jump to that card.</p>'
      + '<ul class="notelist">';
    keys.forEach(k=>{
      (notes[k]||[]).forEach((nt,i)=>{
        h += '<li><button class="qref" data-goto="'+k+'">'+refLabel(k)+'</button>'
          + '<span class="body">'+esc(nt.t)+'</span>'
          + '<button class="del" data-delnote="'+k+'" data-i="'+i+'" title="Delete highlight">&times;</button></li>';
      });
    });
    return h + '</ul></div>';
  }

  function noteBlock(k){
    const my = notes[k] || [];
    if(!my.length) return '';
    let h = '<div class="notes"><ul class="notelist">';
    my.forEach((nt,i)=>{
      h += '<li><span class="body">'+esc(nt.t)+'</span>'
        + '<button class="del" data-delnote="'+k+'" data-i="'+i+'" title="Delete highlight">&times;</button></li>';
    });
    return h + '</ul></div>';
  }
  function badges(k){
    return (star[k]&&filter!=="star"?'<span class="tag starred">★ Quick study</span>':'')
      + ((notes[k]||[]).length?'<span class="tag hasnote">✎ '+notes[k].length+'</span>':'');
  }
  const REASONS = ["Ambiguous wording","Answer looks wrong","Outdated","Duplicate","Too trivial","Not on the exam"];

  function flagBtn(k){
    return '<button class="flagbtn" data-askbad="'+k+'" title="Move to Questionable">&#9873; Poor question</button>';
  }
  function reasonBox(k){
    if(!askBad[k]) return '';
    let h = '<div class="reasonbox"><p>Why is this a poor question?</p><div class="reasons">';
    REASONS.forEach(r=>{ h += '<button data-bad="'+k+'" data-reason="'+r+'">'+r+'</button>'; });
    h += '</div><div class="reasonrow">'
      + '<input type="text" data-reasoninput="'+k+'" placeholder="Or type your own reason">'
      + '<button data-badcustom="'+k+'">Move</button>'
      + '<button data-cancelbad="'+k+'">Cancel</button>'
      + '</div></div>';
    return h;
  }
  function lookup(k){
    const ks = String(k);
    if(ks.charAt(0)==="f" || ks.charAt(0)==="g"){
      const src = ks.charAt(0)==="g" ? F2 : F;
      const f = src.find(x=>ks.charAt(0)+x.i===ks);
      return f ? {title:f.f, detail:f.b, dom:f.d} : null;
    }
    if(ks.charAt(0)==="q"){
      const q = QP.find(x=>"q"+x.n===ks);
      return q ? {title:q.q, detail:(q.o.find(o=>o[1]===2)||["",0])[0], dom:q.d} : null;
    }
    const q = Q.find(x=>String(x.n)===ks);
    return q ? {title:q.q, detail:(q.o.filter(o=>o[1]===2).map(o=>o[0]).join(" / ")), dom:q.d} : null;
  }
  function questionableView(){
    const keys = Object.keys(bad);
    if(!keys.length) return '<p class="empty">Nothing archived yet. Use &#9873; Poor question on any card to move it here with a reason.</p>';
    let h = '<div class="sheet"><h2>Questionable</h2>'
      + '<p class="sub">Archived from the study sets. These stay out of your lists until you restore them.</p></div>';
    keys.forEach(k=>{
      const it = lookup(k);
      h += '<div class="archived"><div class="meta"><span class="qn">'+refLabel(k)+'</span>'
        + (it?'<span>'+dname(it.dom)+'</span>':'') + '</div>'
        + '<p class="prompt">'+esc(it?it.title:"(missing)")+'</p>'
        + (it && it.detail ? '<p class="detail">Answer: '+esc(it.detail)+'</p>' : '')
        + '<div><span class="reasonwhy">'+esc(bad[k].r)+'</span></div>'
        + '<div class="foot"><div class="footL"></div><div class="footR">'
        + '<button class="star" data-restore="'+k+'">Restore to study set</button>'
        + '</div></div></div>';
    });
    return h;
  }

  function starBtn(k){
    return '<button class="star" data-star="'+k+'" aria-pressed="'+(!!star[k])+'">'
      + (star[k] ? '★ In quick study' : '☆ Add to quick study') + '</button>';
  }

  /* ---------- render ---------- */
  function render(){
    let h = '<div class="wrap">' + header() + controls();

    if(mode==="gaps"){
      root.innerHTML = h + gapsView() + '</div>';
      wire(); return;
    }

    if(mode==="bad"){
      root.innerHTML = h + questionableView() + '</div>';
      wire(); return;
    }

    if(mode==="exam"){
      root.innerHTML = h + examView() + '</div>';
      wire(); return;
    }

    if(mode==="defs"){
      root.innerHTML = h + defsView() + '</div>';
      wire(); return;
    }

    if(filter==="notes"){
      root.innerHTML = h + notesView() + '</div>';
      wire(); return;
    }

    if(mode==="misses" || mode==="qpt1"){
      const isQP = mode==="qpt1";
      const src = isQP ? QP : Q;
      const kf = q => isQP ? "q"+q.n : q.n;
      const list = src.filter(q => !bad[kf(q)]).filter(q => filter==="all" ? true : filter==="star" ? !!star[kf(q)]
        : (DOMAINS.some(d=>d[0]===filter) ? q.d===filter : (q.t||[]).includes(filter)));
      if(!list.length) h += emptyMsg();
      list.forEach(q=>{
        const k = kf(q), show = !quizMode || revealed[k];
        h += '<div class="card'+(done[k]&&!star[k]?" done":"")+(star[k]?" starred":"")+'" data-qn="'+k+'">'
          + '<div class="meta"><span class="qn">Q'+q.n+'</span><span>'+dname(q.d)+'</span>'
          + (q.t ? q.t.map(t=>'<span class="tag">'+TAGS[t]+'</span>').join("") : "")
          + (isQP && show ? '<span class="tag '+(q.got?"gotok":"gotmiss")+'">'+(q.got?"You got this right":"You missed this")+'</span>' : "")
          + badges(k)
          + '</div><p class="prompt">'+esc(q.q)+'</p><ul class="opts">';
        q.o.forEach(([txt,st])=>{
          const cls = show ? (st===1?"miss":st===2?"ok":"plain") : "plain";
          const flag = show ? (st===1?"you":st===2?"✓":"") : "";
          h += '<li class="'+cls+'"><span class="flag">'+flag+'</span><span>'+esc(txt)+'</span></li>';
        });
        h += '</ul>';
        if(show) h += '<p class="why">'+esc(q.w)+'</p>' + noteBlock(k);
        h += reasonBox(k);
        h += '<div class="foot"><div class="footL">';
        if(show) h += '<label class="mark"><input type="checkbox" data-done="'+k+'"'+(done[k]?" checked":"")+'> I know this one</label>';
        h += '</div><div class="footR">' + flagBtn(k) + starBtn(k);
        if(!show) h += '<button class="star" data-reveal="'+k+'">Show answer</button>';
        h += '</div></div></div>';
      });

    }else{
      const D = deck(mode), pre = deckKey(mode);
      let list = D.filter(f => !bad[pre+f.i]).filter(f => filter==="all" ? true : filter==="star" ? !!star[pre+f.i] : f.d===filter);
      if(order) list = list.slice().sort((a,b)=>order.indexOf(a.i)-order.indexOf(b.i));
      if(!list.length) h += emptyMsg();
      list.forEach(f=>{
        const k = pre+f.i, show = revealAll || flipped[k];
        h += '<div class="card'+(done[k]&&!star[k]?" done":"")+(star[k]?" starred":"")+'" data-qn="'+k+'">'
          + '<div class="meta"><span class="qn">'+(mode==="cards2"?"FC2 ":"Card ")+f.i+'</span><span>'+dname(f.d)+'</span>'+badges(k)
          + '</div><p class="prompt">'+esc(f.f)+'</p>';
        if(show) h += '<p class="back">'+esc(f.b)+'</p>' + noteBlock(k);
        h += reasonBox(k);
        h += '<div class="foot"><div class="footL">';
        if(show) h += '<label class="mark"><input type="checkbox" data-done="'+k+'"'+(done[k]?" checked":"")+'> I know this one</label>';
        h += '</div><div class="footR">' + flagBtn(k) + starBtn(k)
          + '<button class="star" data-flip="'+k+'">'+(show?"Hide answer":"Show answer")+'</button>'
          + '</div></div></div>';
      });
    }
    root.innerHTML = h + '</div>';
    wire();
  }

  function gapsView(){
    let h = '<div class="sheet"><h2>On the outline, not on either practice test</h2>'
      + '<p class="sub">The practice tests sampled the same familiar ground. These are objectives from the current '
      + 'Platform Administrator outline that none of the practice tests asked about — so a good score on them is untested, not proven. '
      + 'Ordered by section weight.</p>';
    GAPS.forEach(([id,items])=>{
      const d = DOMAINS.find(x=>x[0]===id);
      h += '<div class="gap"><h3>'+d[1]+' <em>'+d[5]+'%</em></h3><ul class="notelist">';
      items.forEach(it=>{ h += '<li><span class="body">'+esc(it)+'</span></li>'; });
      h += '</ul></div>';
    });
    return h + '</div>';
  }

  function defsView(){
    const cats = [];
    DEFS.forEach(([c])=>{ if(cats.indexOf(c)<0) cats.push(c); });
    let h = '<div class="defsearch"><input type="text" id="defq" placeholder="Search '+DEFS.length+' terms and definitions">'
      + '<span class="defcount" id="defcount"></span></div>';
    cats.forEach(c=>{
      h += '<div class="sheet defsec" data-cat="'+c+'"><h2>'+c+'</h2><dl class="deflist">';
      DEFS.filter(d=>d[0]===c).forEach(d=>{
        h += '<div class="defrow" data-term="'+esc(d[1]).toLowerCase()+' '+esc(d[2]).toLowerCase().replace(/"/g,"")+'">'
          + '<dt>'+esc(d[1])+'</dt><dd>'+esc(d[2])+'</dd></div>';
      });
      h += '</dl></div>';
    });
    return h;
  }

  function examView(){
    return '<div class="sheet"><h2>The numbers</h2>'
      + '<p class="sub">Salesforce Certified Platform Administrator, as of the current exam guide.</p>'
      + '<table><tbody>'
      + row("Questions","60 scored, plus up to 5 unscored ones mixed in. You cannot tell which are which.")
      + row("Time","105 minutes — about 1 minute 45 seconds per question.")
      + row("To pass","65%, meaning 39 of the 60 scored questions. Your budget is 21 wrong.")
      + row("Scoring","No partial credit on multi-selects. No penalty for guessing, so never leave one blank.")
      + row("Cost","$200 first attempt, $100 per retake, 24-hour wait before you can sit it again.")
      + row("First-attempt pass rate","Roughly 60%. Salesforce does not publish this — it is a community estimate, so treat it as a rough signal rather than a fact.")
      + '</tbody></table></div>'

      + '<div class="sheet"><h2>Your flagged-question tally</h2>'
      + '<p class="sub">Flag as you go and keep a running count. Assumes you get about 88% of the questions you feel good about, and about 40% of the ones you guess after eliminating two options.</p>'
      + '<table><thead><tr><th>Flagged</th><th>Where that puts you</th></tr></thead><tbody>'
      + '<tr><td>Under 15</td><td>Comfortable. You would have to be unlucky to fail.</td></tr>'
      + '<tr><td>16&ndash;20</td><td>Still favored, roughly 9 in 10. Spend every remaining minute here.</td></tr>'
      + '<tr><td>21&ndash;25</td><td>Uncomfortable — about a 1 in 4 chance of missing.</td></tr>'
      + '<tr><td>26 or more</td><td>More likely to fail than pass.</td></tr>'
      + '</tbody></table>'
      + '<div class="gap"><h3>Three adjustments</h3><ul class="notelist">'
      + li("You will see up to 65 questions but only 60 count. If you tally everything on screen, add about two to each threshold.")
      + li("A flagged multi-select counts double. No partial credit, and a blind guess on \'choose 2 of 5\' lands well below 40%.")
      + li("The tally cannot see your real leak — the ones you feel fine about and still get wrong. On your practice tests that has been most of the damage.")
      + '</ul></div></div>'

      + '<div class="sheet"><h2>Tactics that show up in every pass write-up</h2>'
      + '<ul class="notelist">'
      + li("Flag and move. Do not burn four minutes on one question when the average is under two.")
      + li("Absolute qualifiers — always, never, all, only — usually mark a wrong option. They narrow the field fast.")
      + li("Find the constraint. Phrases like \'without writing code\' or \'with the least administrative effort\' are doing the real work in the question.")
      + li("Eliminate two options first, then choose. On a four-option question that turns a guess into a coin flip.")
      + li("The wording is deliberately indirect. Expect to read a question twice — that is the exam, not you.")
      + li("Never leave anything blank. There is no penalty for a wrong answer.")
      + '</ul></div>'

      + '<div class="sheet"><h2>Where you actually stand</h2>'
      + '<ul class="notelist">'
      + li("Your last three attempts: 75%, 90%, 77%. The common benchmark is to be consistently above 75% on practice before booking, which you are — narrowly.")
      + li("Weighted against the current section weights, your last test comes out around 77%. That is 7 points of margin over the line.")
      + li("Automation has gone 70% to 60% to 56% across three attempts and is 15% of the exam. It is the one section trending the wrong way.")
      + li("Configuration &amp; Setup sits at 67%, also 15%. Those two sections together are 30% of the exam and both are near the line.")
      + '</ul>'
      + '<p class="sub" style="margin:14px 0 0">Exam facts and tactics drawn from Clientell\'s 2026 admin certification guide '
      + '(<a href="https://www.getclientell.com/salesforce-blogs/what-is-the-pass-percentage-for-salesforce-admin-certification" target="_blank" rel="noopener">getclientell.com</a>) '
      + 'and the official Salesforce exam guide. Verify the passing score and format on Salesforce\'s own guide before you book — one reputable source lists 68% rather than 65%.</p>'
      + '</div>' + pairsSheet();
  }
  function pairsSheet(){
    let h = '<div class="sheet pairs"><h2>Names that beat you</h2>'
      + '<p class="sub">Fourteen of your 27 misses on the first practice test came down to picking a plausible name over the real one. '
      + 'Read this the morning of the exam.</p>'
      + '<table><thead><tr><th>Sounds real, isn\'t</th><th>The actual feature</th><th>What it does</th></tr></thead><tbody>';
    PAIRS.forEach(p=>{
      h += '<tr><td><span class="pill bad">'+p[0]+'</span></td>'
        + '<td><span class="pill good">'+p[1]+'</span></td>'
        + '<td>'+p[2]+'</td></tr>';
    });
    return h + '</tbody></table></div>';
  }
  function row(a,b){ return '<tr><td style="color:var(--ink);font-weight:600">'+a+'</td><td colspan="2" style="color:var(--ink-soft)">'+b+'</td></tr>'; }
  function li(t){ return '<li><span class="body">'+t+'</span></li>'; }

  function emptyMsg(){
    return '<p class="empty">'+(filter==="star"
      ? 'Your quick study list is empty. Add anything with ☆ Add to quick study — it stays here even once you mark it as known.'
      : 'Nothing in this filter.')+'</p>';
  }



  /* ---------- events ---------- */
  function wire(){
    const dq = root.querySelector("#defq");
    if(dq){
      dq.oninput=()=>{
        const q = dq.value.trim().toLowerCase();
        let shown = 0;
        root.querySelectorAll(".defsec").forEach(sec=>{
          let any = false;
          sec.querySelectorAll(".defrow").forEach(r=>{
            const hit = !q || r.dataset.term.indexOf(q) >= 0;
            r.style.display = hit ? "" : "none";
            if(hit){ any = true; shown++; }
          });
          sec.style.display = any ? "" : "none";
        });
        const c = root.querySelector("#defcount");
        if(c) c.textContent = q ? shown + (shown===1?" match":" matches") : "";
      };
    }
    const tb = root.querySelector("#toggleBars");
    if(tb) tb.onclick=()=>{ barsOpen=!barsOpen; save(); render(); };
    root.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
      if(mode===b.dataset.mode) return;
      mode=b.dataset.mode;
      if(mode!=="misses" && filter!=="all" && filter!=="star" && filter!=="notes"
         && !DOMAINS.some(d=>d[0]===filter)) filter="all";
      Object.keys(askBad).forEach(x=>delete askBad[x]);
      render();
    });
    const sel = root.querySelector("#filterSel");
    if(sel) sel.onchange=()=>{ filter=sel.value; render(); };
    const qz = root.querySelector("#quiz");
    if(qz) qz.onclick=()=>{ quizMode=!quizMode; Object.keys(revealed).forEach(k=>delete revealed[k]); render(); };
    const ra = root.querySelector("#revealAll");
    if(ra) ra.onclick=()=>{ revealAll=!revealAll; Object.keys(flipped).forEach(k=>delete flipped[k]); render(); };
    const sh = root.querySelector("#shuffle");
    if(sh) sh.onclick=()=>{
      order = deck(mode).map(f=>f.i);
      for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
      render();
    };
    root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{ revealed[b.dataset.reveal]=true; render(); });
    root.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.flip; flipped[k]=!flipped[k]; render();
    });
    root.querySelectorAll("[data-done]").forEach(c=>c.onchange=()=>{ done[c.dataset.done]=c.checked; save(); render(); });
    root.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.star; star[k]=!star[k]; if(!star[k]) delete star[k]; save(); render();
    });
    root.querySelectorAll("[data-askbad]").forEach(b=>b.onclick=()=>{
      askBad[b.dataset.askbad]=true; render();
    });
    root.querySelectorAll("[data-cancelbad]").forEach(b=>b.onclick=()=>{
      delete askBad[b.dataset.cancelbad]; render();
    });
    root.querySelectorAll("[data-bad]").forEach(b=>b.onclick=()=>{
      archive(b.dataset.bad, b.dataset.reason);
    });
    root.querySelectorAll("[data-badcustom]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.badcustom;
      const inp=root.querySelector('[data-reasoninput="'+k+'"]');
      archive(k, inp && inp.value.trim() ? inp.value.trim() : "No reason given");
    });
    root.querySelectorAll("[data-reasoninput]").forEach(t=>{
      t.onkeydown=e=>{
        if(e.key==="Enter"){ e.preventDefault(); archive(t.dataset.reasoninput, t.value.trim()||"No reason given"); }
        if(e.key==="Escape"){ delete askBad[t.dataset.reasoninput]; render(); }
      };
    });
    root.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{
      delete bad[b.dataset.restore]; save(); render();
    });
    root.querySelectorAll("[data-delnote]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.delnote, i=+b.dataset.i;
      (notes[k]||[]).splice(i,1);
      if(!(notes[k]||[]).length) delete notes[k];
      save(); render();
    });
    root.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.goto;
      const c0 = String(k).charAt(0);
      mode = c0==="f" ? "cards" : c0==="g" ? "cards2" : c0==="q" ? "qpt1" : "misses";
      filter="all"; quizMode=false; if(mode==="cards") flipped[k]=true;
      scrollTo_=k; render();
    });
    if(scrollTo_){
      const card = root.querySelector('[data-qn="'+scrollTo_+'"]');
      if(card) card.scrollIntoView({behavior:"smooth", block:"center"});
      scrollTo_=null;
    }
  }

  function archive(k, reason){
    bad[k] = {r: reason, t: Date.now()};
    delete askBad[k];
    save(); render();
  }

  /* ---------- highlight a passage, save the highlight ---------- */
  const pop = document.createElement("div");
  pop.id = "selpop";
  pop.innerHTML = '<span>Save this highlight?</span>'
    + '<button class="primary" id="pop-save">Save highlight</button>'
    + '<button id="pop-cancel">No thanks</button>';
  document.body.appendChild(pop);
  let pending = null;
  function hidePop(){ pop.classList.remove("on"); pending = null; }
  function checkSelection(){
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed){ hidePop(); return; }
    const text = sel.toString().trim();
    if(text.length < 3){ hidePop(); return; }
    let node = sel.anchorNode;
    if(node && node.nodeType === 3) node = node.parentElement;
    const card = node && node.closest ? node.closest(".card") : null;
    if(!card){ hidePop(); return; }
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    if(!rect.width && !rect.height){ hidePop(); return; }
    pending = { k: card.dataset.qn, text: text.replace(/\s+/g," ") };
    pop.style.left = Math.min(Math.max(rect.left + rect.width/2, 120), window.innerWidth - 120) + "px";
    pop.style.top = Math.max(rect.top - 10, 46) + "px";
    pop.classList.add("on");
  }
  document.addEventListener("mouseup", ()=>setTimeout(checkSelection, 10));
  document.addEventListener("touchend", ()=>setTimeout(checkSelection, 10));
  document.addEventListener("scroll", hidePop, true);
  pop.addEventListener("mousedown", e=>e.preventDefault());
  pop.querySelector("#pop-cancel").onclick = hidePop;
  pop.querySelector("#pop-save").onclick = ()=>{
    if(!pending) return;
    const k = pending.k, t = pending.text;
    hidePop();
    const s = window.getSelection(); if(s) s.removeAllRanges();
    addNote(k, t);
    render();
  };

  render();
})();
</script>
</body>
</html>
